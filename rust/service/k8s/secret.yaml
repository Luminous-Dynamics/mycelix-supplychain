apiVersion: v1
kind: Secret
metadata:
  name: provenance-service-secret
  namespace: mycelix
  labels:
    app: provenance-service
    component: secret
type: Opaque
stringData:
  # Database credentials
  # Replace with actual values before applying
  DATABASE_URL: "postgresql://mycelix:CHANGE_ME@postgres.mycelix.svc.cluster.local:5432/provenance"

# NOTE: In production, use a secrets management solution like:
# - Sealed Secrets
# - External Secrets Operator
# - HashiCorp Vault
# - Cloud provider secret managers (AWS Secrets Manager, GCP Secret Manager, etc.)
#
# Never commit actual credentials to git!
